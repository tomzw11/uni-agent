# finance_kb: shell agent over the synthetic finance KB (see README check B).
# kb_source must point at a directory generated by gen_finance_kb.py; the task
# copies it read-only into the session workdir as kb/.
# Launch the runner from a neutral session directory (the local sandbox's
# stateful shell inherits the runner process cwd), never from the repo or out/.
- name: finance_kb
  kb_source: /mnt/share_space/opd/repo_clone/out/kb
  sandbox:
    provider: local
    runtime_timeout: 1800
  agent:
    name: react
    max_steps: 24
    tools:
      - name: stateful_shell
        command_timeout: 60
      - name: finish
    model:
      temperature: 0.6
      top_p: 0.95
      max_total_tokens: 28672
